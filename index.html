<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Olimpíada Ala Piçarreira & Satélite. - Inscrições</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial, sans-serif;margin:0;padding:16px;background:#f4f6f8;color:#222;-webkit-text-size-adjust:100%}
  .wrap{max-width:600px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px;line-height:1.3}
  .sub{font-size:13px;color:#666;margin-bottom:14px}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  label{display:block;font-size:14px;font-weight:bold;margin:12px 0 6px}
  select, input[type=text]{
    width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:8px;
  }
  .games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}
  .game-item{
    display:flex;align-items:center;gap:8px;font-size:14px;background:#f0f2f5;
    padding:10px 12px;border-radius:8px;min-height:44px
  }
  .game-item input[type=checkbox]{width:20px;height:20px;flex-shrink:0}
  .game-item label{margin:0;font-weight:normal;font-size:14px}
  button{
    cursor:pointer;border:none;border-radius:8px;padding:16px;font-size:16px;font-weight:bold;
    background:#2e7d32;color:#fff;margin-top:18px;width:100%;min-height:50px
  }
  button:active{background:#1b5e20}
  button:disabled{opacity:.6;cursor:default}
  .status{font-size:14px;margin-top:10px;text-align:center}
  .status.ok{color:#2e7d32;font-weight:bold}
  .status.err{color:#c62828}

  @media (max-width:400px){
    body{padding:10px}
    .card{padding:12px}
    .games{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏅 Olimpíada da Ala Piçarreira</h1>
  <div class="sub">Preencha sua inscrição abaixo.</div>

  <div class="card">
    <label>Organização</label>
    <select id="orgSelect"></select>

    <label>Nome do participante</label>
    <input type="text" id="nomeInput" placeholder="Digite o nome completo">

    <label>Modalidades</label>
    <div class="games" id="gamesBox"></div>

    <button id="saveBtn" onclick="enviarInscricao()">✅ Enviar Inscrição</button>
    <div class="status" id="saveStatus"></div>
  </div>
</div>

<script>
// ⚠️ IMPORTANTE: troque pela URL do seu Apps Script (Implantar > Nova implantação > App da Web)
// Formato: https://script.google.com/macros/s/XXXXXXXXXXXXXXXX/exec
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydcAVn2Sd8AEOGwKkxiZ2LjFLkMnIS8KvK9iVWKbWEzKFDKFO_YAaiifY_LKG0Le2ChA/exec";

const games = {
  "Sociedade de Socorro": ["Vôlei","Queimada","Ping Pong","Badminton","Corrida de Saco","Corrida com Ovo","Tiro ao Alvo","Cabo de Guerra","Kahoot"],
  "Moças": ["Futebol","Vôlei","Queimada","Ping Pong","Badminton","Corrida de Saco","Corrida com Ovo","Tiro ao Alvo","Cabo de Guerra","Kahoot"],
  "Rapazes": ["Futebol","Vôlei","Queimada","Ping Pong","Badminton","Corrida de Saco","Corrida com Ovo","Tiro ao Alvo","Cabo de Guerra","Kahoot"],
  "Quórum de Élderes": ["Futebol","Vôlei","Queimada","Ping Pong","Badminton","Corrida de Saco","Tiro ao Alvo","Cabo de Guerra","Kahoot"],
  "Primária": ["Corrida de Saco","Corrida com Ovo","Pique-Bandeira","Cabo de Guerra","Boliche","Pescaria","Kahoot"]
};

const orgSelect = document.getElementById('orgSelect');
Object.keys(games).forEach(org=>{
  const opt = document.createElement('option');
  opt.value = org;
  opt.textContent = org;
  orgSelect.appendChild(opt);
});

function buildGamesBox(){
  const org = orgSelect.value;
  const box = document.getElementById('gamesBox');
  box.innerHTML = '';
  games[org].forEach((g,i)=>{
    const div = document.createElement('div');
    div.className = 'game-item';
    div.innerHTML = '<input type="checkbox" id="game_'+i+'" value="'+g+'"><label for="game_'+i+'">'+g+'</label>';
    box.appendChild(div);
  });
}

orgSelect.addEventListener('change', buildGamesBox);
buildGamesBox();

async function enviarInscricao(){
  const org = orgSelect.value;
  const nome = document.getElementById('nomeInput').value.trim();
  const statusEl = document.getElementById('saveStatus');
  const btn = document.getElementById('saveBtn');

  if(!nome){
    statusEl.textContent = '⚠️ Digite o nome do participante.';
    statusEl.className = 'status err';
    return;
  }

  const checked = Array.from(document.querySelectorAll('#gamesBox input[type=checkbox]:checked')).map(c=>c.value);
  if(checked.length===0){
    statusEl.textContent = '⚠️ Selecione ao menos uma modalidade.';
    statusEl.className = 'status err';
    return;
  }

  if(APPS_SCRIPT_URL.includes('COLE_AQUI')){
    statusEl.textContent = '⚠️ Configure a URL do Apps Script no código antes de usar.';
    statusEl.className = 'status err';
    return;
  }

  const body = new URLSearchParams();
  body.append('Nome', nome);
  body.append('Organizacao', org);
  body.append('Modalidades', checked.join(', '));

  btn.disabled = true;
  statusEl.textContent = 'Enviando...';
  statusEl.className = 'status';

  try{
    // Apps Script Web Apps não retornam cabeçalhos CORS legíveis pelo fetch,
    // então usamos "no-cors": o envio funciona normalmente, só não conseguimos
    // ler a resposta de volta (por isso não checamos response.ok aqui).
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: body
    });

    statusEl.textContent = '✅ Inscrição enviada com sucesso!';
    statusEl.className = 'status ok';
    document.getElementById('nomeInput').value = '';
    document.querySelectorAll('#gamesBox input[type=checkbox]').forEach(c=>c.checked=false);
  }catch(e){
    statusEl.textContent = '❌ Erro ao enviar: ' + e.message;
    statusEl.className = 'status err';
  }finally{
    btn.disabled = false;
  }
}
</script>
</body>
</html>
